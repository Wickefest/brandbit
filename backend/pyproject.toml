[project]
name = "brandbit"
version = "0.1.0"
description = "Brandbit — multimodal brand concept generation"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.138.1",
    "httpx>=0.28.1",
    "openai>=2.44.0",
    "pillow>=12.2.0",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "pyrfume>=0.20",
    "python-dotenv>=1.2.2",
    "python-multipart>=0.0.32",
    "scikit-learn>=1.5.0",
    "replicate>=1.0.7",
    "uvicorn>=0.49.0",
]

[project.scripts]
brandbit = "src.main:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
viz = [
    "ipykernel>=6.29.0",
    "jupyter>=1.1.0",
    "matplotlib>=3.9.0",
    "pandas>=2.2.0",
]
audio = [
    "accelerate>=1.6.0",
    "scipy>=1.15.0",
    "torch>=2.6.0",
    "transformers>=4.51.0",
]
clip = [
    "torch>=2.6.0",
    "transformers>=4.51.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["src/test"]
